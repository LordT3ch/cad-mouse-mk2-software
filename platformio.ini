; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data
test_dir = firmware/test

[env:seeed_xiao_rp2040]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-rp2040
framework = arduino

board_build.core = earlephilhower
; 3Dconnexion SpaceMouse Pro (cabled) → ovladač 3DxWare/Fusion ji bere jako originál
board_build.arduino.earlephilhower.usb_vid = 0x256F
board_build.arduino.earlephilhower.usb_pid = 0xC631
; board_build.arduino.earlephilhower.usb_manufacturer =
board_build.arduino.earlephilhower.usb_product = CAD Mouse MK2

build_flags = 
	-DUSE_TINYUSB

lib_deps = 
	infineon/XENSIV 3D Magnetic Sensor TLx493D@^1.1.0
	bxparks/AceButton@^1.10.1
	adafruit/Adafruit NeoPixel@^1.12.3

; Varianta bez VID/PID 3Dconnexion (vlastní identita 0x2E8A/0x0CAE). Blender, slicery a 3DxWare
; ji jako SpaceMouse nepoznají; funguje doplněk Fusionu (přes ikonku) a režim Joystick.
[env:generic_vid]
extends = env:seeed_xiao_rp2040
board_build.arduino.earlephilhower.usb_vid = 0x2E8A
board_build.arduino.earlephilhower.usb_pid = 0x0CAE
